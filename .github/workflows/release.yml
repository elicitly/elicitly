name: Release

# Changesets flow: merging changeset files into main opens/updates a
# "Version Packages" PR; merging THAT PR publishes to npm via trusted
# publishing (GitHub Actions OIDC — no long-lived token). Both packages'
# npm settings name this repo + workflow as their trusted publisher.
# The publish command is pnpm-based so workspace:* devDeps and version
# ranges are resolved by pnpm at pack time; `changeset git-tag` then
# reports the tags to the action via the CHANGESETS_OUTPUT file (requires
# action v2 + Changesets CLI v3), and the action pushes the tags and
# creates the GitHub Releases. Provenance comes from the OIDC flow.
on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC trusted publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # No registry-url here: that input writes an _authToken line into
      # .npmrc, and trusted publishing must authenticate via OIDC alone.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create release PR or publish
        uses: changesets/action@v2
        with:
          publish-script: pnpm release
