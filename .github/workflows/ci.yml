name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR cancels the in-progress run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # One step for the whole toolchain: installs pnpm (version from the root
      # package.json "packageManager" field), Node 22, restores the store
      # cache, and runs the install with --frozen-lockfile (require-lockfile).
      # Pinned to v2.1.0: the floating v2 tag is stale at v2.0.2, which lacks
      # the require-lockfile input (pnpm/setup#48). Move back to @v2 when the
      # tag advances.
      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      # Separate steps so a failing check is obvious in the GitHub UI.
      - run: pnpm build
      - run: pnpm test:coverage
      - run: pnpm typecheck
      - run: pnpm check

      # One upload per package so Codecov tracks them as separate flags.
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/elicitly/coverage/lcov.info
          flags: elicitly
          disable_search: true
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/tools/coverage/lcov.info
          flags: tools
          disable_search: true
