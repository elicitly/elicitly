packages:
  - packages/*

# Single source of truth for dependency versions shared across workspace
# packages; manifests reference these with the "catalog:" protocol and
# pnpm publish substitutes the concrete range at pack time.
catalog:
  "@modelcontextprotocol/sdk": ^1.32.2
  "@vitest/coverage-v8": ^5.1.0
  tsdown: ^0.23.7
  typescript: ^7.0.2
  vitest: ^5.1.0
  zod: ^4.6.7

# Supply-chain policy, explicit so local and CI behave identically: only
# install dependency versions at least 24h old (pnpm's cooling-off gate
# against freshly compromised releases).
minimumReleaseAge: 1440

# pnpm blocks dependency install scripts and agent skills until approved.
# tsdown's skill is only a pointer telling agents to fetch instructions from
# GitHub at runtime, bypassing the lockfile and minimumReleaseAge — denied.
permissions:
  tsdown:
    skills: false
